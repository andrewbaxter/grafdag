[package]
name = "grafdag_web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser DAG editor widget (wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["app"]
# The standalone app entrypoint (fetches/saves the document from the local server)
app = []

[dependencies]
grafdag_core = { path = "../grafdag_core" }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rooting = "0.2"
lunk = "0.3"
ezing = "0.2"
gloo-render = "0.2"
gloo-events = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "SvgElement",
    "WheelEvent",
    "Window",
    "CssStyleDeclaration",
    "KeyboardEventInit",
    "MouseEventInit",
    "WheelEventInit",
    "EventInit",
    "NodeList",
    "MediaQueryList",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "HtmlCollection",
    "DomTokenList",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
