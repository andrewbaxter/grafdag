[package]
name = "grafdag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local app for the grafdag DAG editor: serves the web app in a desktop window or the browser"

[dependencies]
grafdag_core = { path = "../grafdag_core" }
aargvark = "0.12"
htwrap = "0.15"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
serde_json = "1"
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"
open = "5"
tauri = "2"

[build-dependencies]
grafdag_core = { path = "../grafdag_core", features = ["schemask"] }
schemask_core = "0.1.5"
serde_json = "1"
tauri-build = "2"
