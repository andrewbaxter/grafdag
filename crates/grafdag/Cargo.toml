[package]
name = "grafdag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local server for the grafdag DAG editor: serves the web app and saves the document"

[dependencies]
grafdag_core = { path = "../grafdag_core" }
aargvark = "0.12"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
serde_json = "1"
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"
open = "5"
